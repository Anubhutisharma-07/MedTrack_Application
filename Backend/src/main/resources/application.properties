# ==========================================
# MedTrack Backend - Application Properties
# ==========================================

spring.application.name=MedTrack Backend

# ==========================================
# SERVER CONFIG
# ==========================================
# ==========================================
# SERVER CONFIG
# ==========================================
server.port=${PORT:8081}
spring.mvc.pathmatch.matching-strategy=ant_path_matcher

# ==========================================
# DATABASE CONFIG
# Choose ONE: H2 (dev) or MySQL (production)
# ==========================================

# --- OPTION 1: H2 In-Memory (Default for development - no setup needed) ---
spring.datasource.url=${DATABASE_URL:${DB_URL:jdbc:h2:mem:medtrackdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}}
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=${DATABASE_USERNAME:${DB_USERNAME:sa}}
spring.datasource.password=${DATABASE_PASSWORD:${DB_PASSWORD:}}
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=false
spring.h2.console.path=/h2-console

# Demo accounts use credentials published in this repository. They are disabled unless a local or
# test environment opts in, and DataInitializer additionally refuses to run against non-H2 databases.
app.data-initializer.enabled=${DATA_INITIALIZER_ENABLED:false}

# --- OPTION 2: MySQL (Uncomment to use MySQL, set your credentials) ---
# spring.datasource.url=jdbc:mysql://localhost:3306/medtrackdb?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# spring.datasource.username=root
# spring.datasource.password=your_password_here
# spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# ==========================================
# JPA / HIBERNATE
# ==========================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ==========================================
# DATABASE MIGRATIONS
# ==========================================
# Existing deployments can opt in with FLYWAY_ENABLED=true. The baseline
# version is zero so the first MedTrack migration is applied to an existing,
# unversioned schema instead of being skipped.
spring.flyway.enabled=${FLYWAY_ENABLED:false}
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.locations=classpath:db/migration/{vendor}

# ==========================================
# LOGGING
# ==========================================
logging.level.com.medtrack=DEBUG
logging.level.org.springframework.security=INFO

# ==========================================
# PAGINATION CONFIGURATION
# ==========================================
app.pagination.default-page=0
app.pagination.default-page-size=20

# ==========================================
# ACTUATOR & MONITORING
# ==========================================
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.health.probes.enabled=true

# ==========================================
# SUPPLIER CONFIGURATION PLACEHOLDERS
# ==========================================
supplier.orders-endpoint=${SUPPLIER_ORDERS_ENDPOINT:http://localhost:8081/api/supplier/orders}

# Phase 7: Supplier performance scoring weights
app.supplier.scoring.ontime-weight=0.8
app.supplier.scoring.delay-penalty-weight=20.0

# Phase 7: Delay detection scheduler interval (ms)
app.delay.check.interval-ms=60000

# JWT / REFRESH TOKEN CONFIG
# ==========================================
app.jwt.refresh-expiration-days=7

# Account Lockout Cooldown Duration in Minutes
security.account.lock-duration=30

# OTP Configuration
security.otp.length=6
security.otp.expiry-minutes=10
security.otp.max-attempts=5

# Rate Limiting Configuration - Auth Endpoints (login, register, forgot-password, etc.)
security.rate-limit.auth.capacity=10
security.rate-limit.auth.refill-tokens=10
security.rate-limit.auth.refill-duration=1m

# Rate Limiting Configuration - GET Endpoints (read operations)
security.rate-limit.get.capacity=100
security.rate-limit.get.refill-tokens=100
security.rate-limit.get.refill-duration=1m

# Rate Limiting Configuration - Write Endpoints (POST/PUT/DELETE)
security.rate-limit.write.capacity=30
security.rate-limit.write.refill-tokens=30
security.rate-limit.write.refill-duration=1m

# Peer addresses whose X-Forwarded-For header may be trusted when identifying the client.
# Empty means the header is ignored and every request is keyed on the socket address.
# X-Forwarded-For is a plain request header that any client can set, so trusting it without
# knowing the request came through a real proxy lets a caller pick its own rate-limit bucket and
# bypass the limit entirely. Set this to your proxy/load-balancer addresses when deploying behind
# one, e.g. security.rate-limit.trusted-proxies=10.0.0.5,10.0.0.6
security.rate-limit.trusted-proxies=

# Bound on the bucket cache. The map was previously unbounded, so a request loop varying
# X-Forwarded-For grew it until the heap was exhausted. Entries idle for longer than the TTL are
# reclaimed; once the cap is reached, callers share a per-group overflow bucket.
security.rate-limit.max-tracked-clients=10000
security.rate-limit.client-ttl=10m

# ==========================================
# KAFKA CONFIGURATION
# ==========================================
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.max.block.ms=3000
spring.kafka.producer.retries=0
app.kafka.topics.user-events=user-events

# Kafka Consumer Configuration
spring.kafka.consumer.group-id=supplier-order-sync
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.medtrack.*
spring.kafka.producer.properties.interceptor.classes=com.medtrack.supplier.kafka.KafkaLoggingProducerInterceptor
spring.kafka.consumer.properties.interceptor.classes=com.medtrack.supplier.kafka.KafkaLoggingConsumerInterceptor
app.kafka.topics.order-events=order-events
# Phase 7: Delay detection event topic
app.kafka.topics.delay-events=delay-events
# Phase 10: Supplier analytics event topic
app.kafka.topics.analytics-events=analytics-events

# ==========================================
# EUREKA DISCOVERY CLIENT
# ==========================================
spring.application.name=medtrack-backend
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${random.value}

# JWT Secrets Config
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:900000}

# ==========================================
# SPRING BOOT ACTUATOR CONFIGURATION
# ==========================================
# Web Endpoint Exposure: Expose health, info, metrics, prometheus
management.endpoints.web.exposure.include=health,info,metrics,prometheus

# Show full details of the components in health endpoint
management.endpoint.health.show-details=always
management.health.probes.enabled=true

# Enable health indicators
management.health.db.enabled=true
management.health.redis.enabled=true

# Info contributor metadata
info.app.name=MedTrack Backend
info.app.version=1.1.0
info.app.environment=production
info.app.description=MedTrack Backend Monitoring Service
